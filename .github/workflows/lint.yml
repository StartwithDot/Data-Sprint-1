name: Linting

on:
  pull_request:
    paths:
      - 'platform/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install sqlfluff black flake8

      - name: Run SQL linter
        run: sqlfluff lint platform/ --dialect snowflake

      - name: Run Python linter
        run: |
          black --check platform/
          flake8 platform/
