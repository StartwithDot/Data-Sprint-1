name: dbt Check

on:
  pull_request:
    paths:
      - 'platform/**'

jobs:
  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Run dbt parse
        run: dbt parse --project-dir platform/
